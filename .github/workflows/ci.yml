name: "Lint & Tests"
permissions:
  contents: read
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  lint:
    # This is Ubuntu 24.04 currently: https://github.com/actions/runner-images/blob/ubuntu24/20250907.24/images/ubuntu/Ubuntu2404-Readme.md
    # Building an own image is not worth it, pulling it in gh actions
    # is about as slow as installing the dependencies and it blocks using cached gems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Without the man-db flag file, apt-get install skips the slow man page index rebuild
      - name: Install dependencies
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libimlib2-dev
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          # caches by Gemfile.lock checksum
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci --ignore-scripts
      # New advisories must not block unrelated changes. audit.yml fails daily to notify.
      - name: Security audit dependencies
        continue-on-error: true
        run: bin/bundler-audit --update
      - name: Security audit application code
        run: bin/brakeman -q -w2
      - name: Lint Ruby files
        run: bin/rubocop --parallel
      - name: Lint Javascript
        run: npm run lint:js
      - name: Lint CSS
        run: npm run lint:css

  test:
    runs-on: ubuntu-latest
    # One spec process per job: two browsers on one runner compete for its 4 CPUs, and
    # that makes the spec runtimes too uneven for the runtime split to balance. All jobs
    # must compute the same 6 groups, so they must read the same runtime log. Only the
    # coverage job writes that cache.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    env:
      RAILS_ENV: test
      COVERAGE: true
      CI_PART: ${{ matrix.part }} # turns off the per job coverage minimum
    steps:
      # A service container blocks the job until its image is pulled. In the background,
      # the pull overlaps the setup steps. Its output must not hold the step's stdio open.
      - name: Start MongoDB
        run: (docker run -d --name mongo -p 27017:27017 mongo:9.0.4 > /dev/null 2>&1 &)
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libimlib2-dev imagemagick
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          # caches by Gemfile.lock checksum
          bundler-cache: true
      # Share test run timings across CI runs for optimal distribution
      - name: Restore spec runtimes
        uses: actions/cache/restore@v4
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.run_id }}
          restore-keys: rspec-runtime-
      - name: Wait for MongoDB
        run: |
          timeout 90 bash -c 'until docker exec mongo mongosh --quiet --eval "db.adminCommand({ping: 1})"; do sleep 1; done'
      - name: Run tests
        id: rspec
        run: |
          # --group-by runtime reads the log without a rescue, so it must exist
          mkdir -p tmp && touch tmp/parallel_runtime_rspec.log
          bin/parallel_rspec spec engines -n 6 \
            --group-by runtime --allowed-missing 100 --only-group ${{ matrix.part }}
        shell: bash
      # The coverage job needs this artifact, so a failed upload must fail this job.
      # Otherwise "re-run failed jobs" only re-runs coverage and never regenerates it.
      - name: Upload partial results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: part-${{ matrix.part }}
          include-hidden-files: true
          path: |
            coverage/.resultset.json
            tmp/parallel_runtime_rspec.log
      # Diagnostic uploads only. The artifact backend returns transient 403s on
      # finalize, which must not change the job result.
      - name: Upload screenshots
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-${{ matrix.part }}
          path: ./tmp/capybara
      - name: Upload logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: rails-logs-${{ matrix.part }}
          path: ./log/test.log

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
      # The collate step needs only simplecov, so skip apt and the app bundle
      - name: Install simplecov
        run: gem install simplecov --no-document -v "$(grep -oP '^    simplecov \(\K[^)]+' Gemfile.lock)"
      - name: Download partial results
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      # Every job only knows the coverage of its own groups. The minimum in
      # spec/rails_helper.rb therefore cannot apply. Enforce it over the merged data.
      - name: Check merged coverage
        run: |
          ruby -e '
            require "simplecov"
            SimpleCov.collate Dir["parts/*/coverage/.resultset.json"], "rails" do
              minimum_coverage 100
              skip "app/jobs/application_job.rb"
              skip "lib/tasks"
            end
          '
      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: ./coverage
      - name: Merge spec runtimes
        run: |
          mkdir -p tmp
          cat parts/*/tmp/parallel_runtime_rspec.log > tmp/parallel_runtime_rspec.log
      - name: Save spec runtimes
        uses: actions/cache/save@v4
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-${{ github.run_id }}
